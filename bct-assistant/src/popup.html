<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BCT Legal Assistant</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, #f4f8fc 0%, #e8eef5 100%);
      color: #1a2b3c;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 6px;
      color: #003366;
    }
    p {
      margin: 0 0 12px;
      font-size: 12px;
      line-height: 1.45;
      color: #4a6070;
    }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      background: #e2e8f0;
      color: #334155;
      margin-bottom: 10px;
    }
    button.btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #003366;
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
      border: none;
      cursor: pointer;
    }
    button.btn:hover { background: #005599; }
  </style>
</head>
<body>
  <div class="badge" id="status">Checking backend…</div>
  <h1>BCT Legal Assistant</h1>
  <p>Open any BCT page — a side panel will appear.</p>
  <button type="button" class="btn" id="openDash">Open Institutional Dashboard</button>
  <script src="popup.js"></script>
</body>
</html>
